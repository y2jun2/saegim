<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#F7F5F0">

<title>새김</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #F7F5F0;
  color: #24231F;
  font-family: -apple-system, BlinkMacSystemFont,
               "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
}

.app {
  max-width: 430px;
  min-height: 100vh;
  margin: auto;
  padding: 55px 24px 120px;
}

.logo {
  font-family: Georgia, "Noto Serif KR", serif;
  font-size: 29px;
  font-weight: 600;
  margin-bottom: 50px;
}

.label {
  font-size: 13px;
  color: #8B887F;
  margin-bottom: 17px;
}

.verse {
  font-family: Georgia, "Noto Serif KR", serif;
  font-size: 28px;
  line-height: 1.55;
  letter-spacing: -1px;
  white-space: pre-line;
  margin: 0;
}

.reference {
  margin-top: 17px;
  font-size: 14px;
  color: #77736B;
}

.divider {
  height: 1px;
  background: #E3DFD7;
  margin: 40px 0 28px;
}

.section-title {
  font-size: 13px;
  color: #77736B;
  margin-bottom: 10px;
}

.application {
  font-size: 17px;
  line-height: 1.65;
  white-space: pre-line;
}

.music {
  margin-top: 42px;
}

.song {
  background: #EEEAE2;
  border-radius: 18px;
  padding: 17px 18px;
  margin-top: 10px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.song-type {
  font-size: 12px;
  color: #88847B;
  margin-bottom: 5px;
}

.song-name {
  font-size: 15px;
  font-weight: 500;
}

.play { font-size: 18px; }

.bottom-button {
  position: fixed;
  bottom: 25px;
  left: 50%;
  transform: translateX(-50%);
  width: calc(100% - 48px);
  max-width: 382px;
  border: none;
  border-radius: 17px;
  padding: 17px;
  background: #24231F;
  color: white;
  font-size: 16px;
  cursor: pointer;
}

/* 기록 화면 */

.editor {
  display: none;
}

.back {
  border: none;
  background: none;
  padding: 0;
  font-size: 25px;
  margin-bottom: 32px;
  cursor: pointer;
}

.editor-title {
  font-family: Georgia, "Noto Serif KR", serif;
  font-size: 27px;
  margin-bottom: 38px;
}

.field {
  margin-bottom: 28px;
}

.field label {
  display: block;
  font-size: 13px;
  color: #77736B;
  margin-bottom: 10px;
}

input, textarea {
  width: 100%;
  border: 0;
  border-bottom: 1px solid #D8D3CA;
  border-radius: 0;
  background: transparent;
  padding: 8px 0 13px;
  font-family: inherit;
  font-size: 16px;
  color: #24231F;
  outline: none;
}

input:focus, textarea:focus {
  border-bottom-color: #24231F;
}

textarea {
  min-height: 180px;
  resize: vertical;
  line-height: 1.7;
}

.short-textarea {
  min-height: 70px;
}

.save {
  width: 100%;
  border: 0;
  border-radius: 17px;
  padding: 17px;
  background: #24231F;
  color: white;
  font-size: 16px;
  margin-top: 15px;
  cursor: pointer;
}

.sermon-preview {
  margin-top: 35px;
  padding: 20px;
  border-radius: 18px;
  background: #EEEAE2;
}

.sermon-preview-title {
  font-size: 12px;
  color: #88847B;
  margin-bottom: 9px;
}

.sermon-preview-text {
  font-size: 14px;
  line-height: 1.65;
  white-space: pre-line;
}

.empty {
  color: #99958C;
}
</style>
</head>

<body>

<!-- 메인 -->
<div class="app" id="home">

  <div class="logo">새김</div>

  <div class="label">이번 주 나의 말씀</div>

  <h1 class="verse" id="homeMessage">
“두려워하지 말라
내가 너와 함께 함이라”
  </h1>

  <div class="reference" id="homeVerse">
    이사야 41:10
  </div>

  <div class="divider"></div>

  <section>
    <div class="section-title">이번 주의 적용</div>

    <div class="application" id="homeAction">
      불안한 순간마다 먼저 하나님께 기도하기.
    </div>
  </section>

  <div class="sermon-preview" id="sermonBox">
    <div class="sermon-preview-title">이번 주 설교</div>
    <div class="sermon-preview-text" id="homeSermon">
      아직 저장된 설교 기록이 없습니다.
    </div>
  </div>

  <section class="music">

    <div class="section-title">오늘의 찬양</div>

    <div class="song">
      <div>
        <div class="song-type">☀️ 신나는 찬양</div>
        <div class="song-name">오늘의 추천 찬양</div>
      </div>
      <div class="play">▶</div>
    </div>

    <div class="song">
      <div>
        <div class="song-type">🌙 잔잔한 찬양</div>
        <div class="song-name">오늘의 추천 찬양</div>
      </div>
      <div class="play">▶</div>
    </div>

  </section>

  <button class="bottom-button" onclick="openEditor()">
    + 이번 주 말씀 새기기
  </button>

</div>


<!-- 말씀 기록 -->
<div class="app editor" id="editor">

  <button class="back" onclick="closeEditor()">←</button>

  <div class="editor-title">
    이번 주 말씀을<br>새겨볼까요?
  </div>

  <div class="field">
    <label>성경 구절</label>
    <input
      id="verseInput"
      placeholder="예) 이사야 41:10"
    >
  </div>

  <div class="field">
    <label>설교 제목</label>
    <input
      id="titleInput"
      placeholder="설교 제목을 기록하세요"
    >
  </div>

  <div class="field">
    <label>설교 메시지</label>
    <textarea
      id="sermonInput"
      placeholder="예배 중 받은 말씀과 설교 내용을 자유롭게 기록하세요."
    ></textarea>
  </div>

  <div class="field">
    <label>✨ 이번 주 새길 한 문장</label>
    <textarea
      class="short-textarea"
      id="messageInput"
      placeholder="이번 주 마음에 새기고 싶은 한 문장"
    ></textarea>
  </div>

  <div class="field">
    <label>🙏 한 줄 기도</label>
    <textarea
      class="short-textarea"
      id="prayerInput"
      placeholder="이 말씀을 붙들고 드리는 기도"
    ></textarea>
  </div>

  <div class="field">
    <label>🌱 이번 주 적용</label>
    <textarea
      class="short-textarea"
      id="actionInput"
      placeholder="이번 주 삶에서 실천할 한 가지"
    ></textarea>
  </div>

  <button class="save" onclick="saveSaegim()">
    말씀 새기기
  </button>

</div>


<script>

const STORAGE_KEY = "saegim-current";

function openEditor() {

  const data = getSavedData();

  if (data) {
    document.getElementById("verseInput").value =
      data.verse || "";

    document.getElementById("titleInput").value =
      data.title || "";

    document.getElementById("sermonInput").value =
      data.sermon || "";

    document.getElementById("messageInput").value =
      data.message || "";

    document.getElementById("prayerInput").value =
      data.prayer || "";

    document.getElementById("actionInput").value =
      data.action || "";
  }

  document.getElementById("home").style.display = "none";
  document.getElementById("editor").style.display = "block";

  window.scrollTo(0,0);
}

function closeEditor() {
  document.getElementById("editor").style.display = "none";
  document.getElementById("home").style.display = "block";

  window.scrollTo(0,0);
}

function saveSaegim() {

  const data = {

    verse:
      document.getElementById("verseInput").value.trim(),

    title:
      document.getElementById("titleInput").value.trim(),

    sermon:
      document.getElementById("sermonInput").value.trim(),

    message:
      document.getElementById("messageInput").value.trim(),

    prayer:
      document.getElementById("prayerInput").value.trim(),

    action:
      document.getElementById("actionInput").value.trim(),

    savedAt:
      new Date().toISOString()
  };

  if (!data.verse && !data.message && !data.sermon) {
    alert("말씀이나 설교 내용을 하나 이상 기록해주세요.");
    return;
  }

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(data)
  );

  renderHome();
  closeEditor();
}

function getSavedData() {

  const saved =
    localStorage.getItem(STORAGE_KEY);

  if (!saved) return null;

  try {
    return JSON.parse(saved);
  }
  catch {
    return null;
  }
}

function renderHome() {

  const data = getSavedData();

  if (!data) return;

  const message =
    data.message || "이번 주 말씀을 다시 묵상해보세요.";

  document.getElementById("homeMessage").textContent =
    "“" + message + "”";

  document.getElementById("homeVerse").textContent =
    data.verse || "말씀";

  document.getElementById("homeAction").textContent =
    data.action || "이번 주 적용을 기록해보세요.";

  document.getElementById("homeSermon").textContent =
    data.sermon || "저장된 설교 메시지가 없습니다.";
}

renderHome();

</script>

</body>
</html>
