<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>새김</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #F7F5F0;
      color: #222;
      font-family: -apple-system, BlinkMacSystemFont,
                   "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    }

    .app {
      max-width: 430px;
      min-height: 100vh;
      margin: auto;
      padding: 60px 24px 110px;
    }

    .logo {
      font-family: Georgia, serif;
      font-size: 28px;
      font-weight: 600;
      margin-bottom: 55px;
    }

    .label {
      font-size: 13px;
      color: #8B887F;
      margin-bottom: 18px;
    }

    .verse {
      font-family: Georgia, "Noto Serif KR", serif;
      font-size: 29px;
      line-height: 1.55;
      letter-spacing: -1px;
      margin: 0;
    }

    .reference {
      margin-top: 18px;
      font-size: 14px;
      color: #77736B;
    }

    .divider {
      height: 1px;
      background: #E4E0D8;
      margin: 42px 0 30px;
    }

    .section-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 13px;
    }

    .application {
      font-size: 17px;
      line-height: 1.6;
    }

    .music {
      margin-top: 42px;
    }

    .song {
      background: #EEEAE2;
      border-radius: 18px;
      padding: 17px 18px;
      margin-top: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .song-type {
      font-size: 12px;
      color: #88847B;
      margin-bottom: 5px;
    }

    .song-name {
      font-size: 15px;
      font-weight: 500;
    }

    .play {
      font-size: 19px;
    }

    .add {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 48px);
      max-width: 382px;
      border: none;
      border-radius: 16px;
      padding: 17px;
      background: #24231F;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <main class="app">

    <div class="logo">새김</div>

    <div class="label">이번 주 나의 말씀</div>

    <h1 class="verse">
      “두려워하지 말라<br>
      내가 너와 함께 함이라”
    </h1>

    <div class="reference">
      이사야 41:10
    </div>

    <div class="divider"></div>

    <section>
      <div class="section-title">이번 주의 적용</div>
      <div class="application">
        불안한 순간마다<br>
        먼저 하나님께 기도하기.
      </div>
    </section>

    <section class="music">

      <div class="section-title">오늘의 찬양</div>

      <div class="song">
        <div>
          <div class="song-type">☀️ 신나는 찬양</div>
          <div class="song-name">오늘의 추천 찬양</div>
        </div>
        <div class="play">▶</div>
      </div>

      <div class="song">
        <div>
          <div class="song-type">🌙 잔잔한 찬양</div>
          <div class="song-name">오늘의 추천 찬양</div>
        </div>
        <div class="play">▶</div>
      </div>

    </section>

  </main>

  <button class="add">
    + 이번 주 말씀 새기기
  </button>

</body>
</html>
